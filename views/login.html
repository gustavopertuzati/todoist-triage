<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Connexion · Triage pour Todoist</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand brand-login">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 6h16M4 12h10M4 18h7" stroke-linecap="round" />
              <path d="m16 16 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
          <span class="brand-text"><strong>Triage</strong><span>pour Todoist</span></span>
        </div>

        <h1 id="login-title">Reprendre la main.</h1>
        <p class="login-subtitle">
          Ton espace personnel pour trier ton Todoist, en lecture seule pour l’instant.
        </p>

        <div id="config-alert" class="alert alert-warn" hidden role="alert"></div>

        <form id="login-form" novalidate>
          <label class="field-label" for="password">Mot de passe</label>
          <div class="password-row">
            <input
              id="password"
              name="password"
              type="password"
              inputmode="text"
              autocomplete="current-password"
              autocapitalize="none"
              spellcheck="false"
              required
              placeholder="••••••••"
            />
            <button id="toggle-password" class="btn btn-ghost" type="button" aria-pressed="false">
              Afficher
            </button>
          </div>
          <div id="login-error" class="alert alert-error" role="alert" hidden></div>
          <button id="login-submit" class="btn btn-primary btn-block" type="submit">
            Entrer
          </button>
        </form>

        <p class="login-note">
          Le mot de passe et le token Todoist restent sur le serveur.
          Aucune donnée Todoist n’est chargée avant connexion.
        </p>
      </section>

      <footer class="login-footer">
        <span>Itération 1 · lecture seule</span>
        <span aria-hidden="true">·</span>
        <span>Non affilié à Todoist</span>
      </footer>
    </main>
  </body>
</html>
